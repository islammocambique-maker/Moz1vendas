<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOZ1VENDAS - Catálogo & Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">MOZ1VENDAS</h1>
      <div id="authArea">
        <button onclick="abrirModalAuth()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">Entrar / Registar</button>
      </div>
    </div>
  </header>

  <!-- FILTROS E BUSCA -->
  <main class="container mx-auto p-4 flex-grow">
    <div class="bg-white p-4 rounded-xl shadow mb-6 flex flex-col md:flex-row gap-4">
      <input type="text" id="inputBusca" placeholder="Buscar produtos..." class="flex-grow border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <select id="selectCategoria" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Todas Categorias</option>
        <option value="FISICO">Produtos Físicos</option>
        <option value="DIGITAL">Produtos Digitais</option>
      </select>
      <button onclick="carregarProdutos()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Filtrar</button>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <div id="gridProdutos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="text-gray-500 col-span-full text-center py-8">Carregando produtos...</p>
    </div>
  </main>

  <!-- MODAL DE CHECKOUT / COMPRA -->
  <div id="modalCompra" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-md w-full relative">
      <button onclick="fecharModal('modalCompra')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 id="modalTitulo" class="text-xl font-bold mb-2">Comprar Produto</h2>
      <p id="modalPreco" class="text-lg text-blue-600 font-bold mb-4"></p>
      
      <form id="formCheckout" onsubmit="processarCompra(event)">
        <input type="hidden" id="compraProdutoId">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Telefone M-Pesa / e-Mola</label>
          <input type="tel" id="clienteTelefone" placeholder="841234567" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Método de Pagamento</label>
          <select id="metodoPagamento" class="w-full border p-2 rounded-lg">
            <option value="mpesa">M-Pesa</option>
            <option value="emola">e-Mola</option>
          </select>
        </div>
        <button type="submit" id="btnPagar" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Pagar com Netshop</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT INTEGRADO COM O GAS -->
  <script>
    // URL DE DEPLOY DO SEU GOOGLE APPS SCRIPT (Web App URL)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz62rB-RTzLg-h6fXMogftj01-z-sCOtTz0PFo7BoTdalzoVQvnIoOfi5a7vcBhOGMh/exec";

    document.addEventListener("DOMContentLoaded", () => {
      carregarProdutos();
      verificarSessao();
    });

    async function carregarProdutos() {
      const grid = document.getElementById("gridProdutos");
      grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Carregando produtos...</p>`;

      const busca = document.getElementById("inputBusca").value;
      const cat = document.getElementById("selectCategoria").value;

      try {
        const res = await fetch(`${GAS_URL}?action=produtos&search=${encodeURIComponent(busca)}&categoria=${encodeURIComponent(cat)}`);
        const json = await res.json();

        if (json.ok && json.produtos.length > 0) {
          grid.innerHTML = json.produtos.map(p => `
            <div class="bg-white rounded-xl shadow overflow-hidden flex flex-col justify-between">
              <img src="${p.imagemUrl || 'https://via.placeholder.com/300'}" alt="${p.nome}" class="w-full h-48 object-cover">
              <div class="p-4 flex-grow">
                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">${p.tipo}</span>
                <h3 class="font-bold text-lg mt-2">${p.nome}</h3>
                <p class="text-gray-600 text-sm mt-1 line-clamp-2">${p.descricao}</p>
                <p class="text-blue-600 font-bold text-xl mt-3">${p.preco} MT</p>
                <p class="text-xs text-gray-400 mt-1">Vendedor: ${p.marca}</p>
              </div>
              <div class="p-4 border-t">
                ${p.metodoPagamento === 'NETSHOP' 
                  ? `<button onclick="abrirCompra('${p.produtoId}', '${p.nome}', ${p.preco})" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">Comprar Agora</button>`
                  : `<a href="https://wa.me/${p.whatsapp}?text=Olá! Tenho interesse no produto: ${encodeURIComponent(p.nome)}" target="_blank" class="w-full block text-center bg-green-500 text-white py-2 rounded-lg font-bold hover:bg-green-600 transition">Contactar WhatsApp</a>`
                }
              </div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Nenhum produto encontrado.</p>`;
        }
      } catch (e) {
        grid.innerHTML = `<p class="text-red-500 col-span-full text-center py-8">Erro ao carregar produtos.</p>`;
      }
    }

    function abrirCompra(id, nome, preco) {
      document.getElementById("compraProdutoId").value = id;
      document.getElementById("modalTitulo").innerText = nome;
      document.getElementById("modalPreco").innerText = `${preco} MT`;
      document.getElementById("modalCompra").classList.remove("hidden");
    }

    function fecharModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    async function processarCompra(e) {
      e.preventDefault();
      const btn = document.getElementById("btnPagar");
      btn.disabled = true;
      btn.innerText = "Processando...";

      const payload = {
        action: "criarPagamento",
        produtoId: document.getElementById("compraProdutoId").value,
        clienteTelefone: document.getElementById("clienteTelefone").value,
        metodo: document.getElementById("metodoPagamento").value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.ok && json.checkoutUrl) {
          window.location.href = json.checkoutUrl;
        } else if (json.ok) {
          alert("Solicitação de pagamento enviada ao seu telefone!");
          fecharModal("modalCompra");
        } else {
          alert("Erro: " + (json.erro || "Falha ao processar"));
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Pagar com Netshop";
      }
    }

    function verificarSessao() {
      const token = localStorage.getItem("moz1_token");
      if (token) {
        document.getElementById("authArea").innerHTML = `
          <button onclick="sair()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-600 transition">Sair</button>
        `;
      }
    }

    function sair() {
      localStorage.removeItem("moz1_token");
      location.reload();
    }
  </script>
</body>
</html>
