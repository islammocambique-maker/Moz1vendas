<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOZ1VENDAS — Marketplace de Moçambique</title>
  <meta name="description" content="Compre e venda produtos físicos e digitais em Moçambique. Pagamentos via M-Pesa, e-Mola, mKesh e cartão.">
  <link rel="stylesheet" href="css/style.css">
<base target="_blank">
</head>
<body>
  <!-- Header -->
  <header class="header" id="appHeader">
    <div class="header-inner">
      <div class="logo" onclick="navigate('home')">
        <div class="logo-icon">🛒</div>
        <span>MOZ1VENDAS</span>
      </div>
      <nav class="nav-links">
        <a onclick="navigate('home')">Início</a>
        <a onclick="navigate('produtos')">Produtos</a>
        <a onclick="navigate('vender')">Vender na MOZ1VENDAS</a>
        <a onclick="navigate('login')">Entrar</a>
      </nav>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
    </div>
  </header>

  <!-- Páginas -->
  <main>
    <!-- Home -->
    <div class="page" id="pageHome"></div>

    <!-- Produtos -->
    <div class="page hidden" id="pageProdutos"></div>

    <!-- Detalhe Produto -->
    <div class="page hidden" id="pageProduto"></div>

    <!-- Login -->
    <div class="page hidden" id="pageLogin"></div>

    <!-- Registo -->
    <div class="page hidden" id="pageRegisto"></div>

    <!-- Dashboard -->
    <div class="page hidden" id="pageDashboard"></div>

    <!-- Meus Produtos -->
    <div class="page hidden" id="pageMeusProdutos"></div>

    <!-- Adicionar Produto -->
    <div class="page hidden" id="pageAdicionarProduto"></div>

    <!-- Editar Produto -->
    <div class="page hidden" id="pageEditarProduto"></div>

    <!-- Minhas Vendas -->
    <div class="page hidden" id="pageMinhasVendas"></div>

    <!-- Carteira -->
    <div class="page hidden" id="pageCarteira"></div>

    <!-- Plano -->
    <div class="page hidden" id="pagePlano"></div>

    <!-- Vender -->
    <div class="page hidden" id="pageVender"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <h3>MOZ1VENDAS</h3>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 16px;">O marketplace mais simples e seguro para comprar e vender em Moçambique.</p>
      </div>
      <div>
        <h3>Links Rápidos</h3>
        <a onclick="navigate('home')">Início</a>
        <a onclick="navigate('produtos')">Produtos</a>
        <a onclick="navigate('vender')">Vender</a>
      </div>
      <div>
        <h3>Vendedor</h3>
        <a onclick="navigate('login')">Entrar</a>
        <a onclick="navigate('registo')">Registar-se</a>
      </div>
      <div>
        <h3>Contacto</h3>
        <a href="https://wa.me/258860407269" target="_blank">WhatsApp Admin</a>
        <p style="color: rgba(255,255,255,0.6); margin-top: 8px; font-size: 0.9rem;">© 2026 MOZ1VENDAS</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>Feito com ❤️ em Moçambique</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
