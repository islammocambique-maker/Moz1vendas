<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOZ1VENDAS - Catálogo & Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide cursor-pointer" onclick="carregarProdutos()">MOZ1VENDAS</h1>
      <div id="authArea" class="flex gap-2">
        <button onclick="abrirModalAuth()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">Entrar / Registar</button>
      </div>
    </div>
  </header>

  <!-- FILTROS E BUSCA -->
  <main class="container mx-auto p-4 flex-grow">
    <div class="bg-white p-4 rounded-xl shadow mb-6 flex flex-col md:flex-row gap-4">
      <input type="text" id="inputBusca" placeholder="Buscar produtos..." class="flex-grow border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <select id="selectCategoria" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Todas Categorias</option>
        <option value="FISICO">Produtos Físicos</option>
        <option value="DIGITAL">Produtos Digitais</option>
      </select>
      <button onclick="carregarProdutos()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Filtrar</button>
    </div>

    <!-- LISTA DE PRODUTOS DA LOJA -->
    <div id="gridProdutos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="text-gray-500 col-span-full text-center py-8">Carregando produtos...</p>
    </div>
  </main>

  <!-- MODAL SELEÇÃO AUTH -->
  <div id="modalAuth" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-sm w-full relative text-center">
      <button onclick="fecharModal('modalAuth')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 class="text-xl font-bold mb-4">Área do Vendedor</h2>
      <p class="text-gray-600 text-sm mb-6">Escolha uma opção para continuar:</p>
      <div class="flex flex-col gap-3">
        <button onclick="trocarModalAuth('modalAuth', 'modalLogin')" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">Entrar na Conta</button>
        <button onclick="trocarModalAuth('modalAuth', 'modalRegisto')" class="w-full bg-gray-200 text-gray-800 py-2 rounded-lg font-bold hover:bg-gray-300 transition">Criar Nova Conta</button>
      </div>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modalLogin" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-md w-full relative">
      <button onclick="fecharModal('modalLogin')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 class="text-xl font-bold mb-4">Entrar como Vendedor</h2>
      <form onsubmit="fazerLogin(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Empresa ou Telefone</label>
          <input type="text" id="loginIdentificador" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">PIN Numérico</label>
          <input type="password" id="loginPin" required class="w-full border p-2 rounded-lg">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Entrar</button>
      </form>
    </div>
  </div>

  <!-- MODAL REGISTO -->
  <div id="modalRegisto" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-md w-full relative max-h-[90vh] overflow-y-auto">
      <button onclick="fecharModal('modalRegisto')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 class="text-xl font-bold mb-4">Registar Vendedor</h2>
      <form onsubmit="fazerRegisto(event)">
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Nome Completo</label>
          <input type="text" id="regNome" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Telefone</label>
          <input type="tel" id="regTelefone" placeholder="841234567" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Número do BI</label>
          <input type="text" id="regBi" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Nome da Empresa / Marca</label>
          <input type="text" id="regEmpresa" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">PIN Secreto</label>
          <input type="password" id="regPin" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Plano Inicial</label>
          <select id="regPlano" class="w-full border p-2 rounded-lg">
            <option value="SIMPLES">Plano Simples</option>
          </select>
        </div>
        <button type="submit" id="btnRegisto" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Registar Conta</button>
      </form>
    </div>
  </div>

  <!-- MODAL PAINEL DO VENDEDOR (MEUS PRODUTOS / ADICIONAR PRODUTO) -->
  <div id="modalPainelVendedor" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-2xl w-full relative max-h-[90vh] overflow-y-auto">
      <button onclick="fecharModal('modalPainelVendedor')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">Painel do Vendedor</h2>
        <button onclick="abrirModalCriarProduto()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition">+ Adicionar Produto</button>
      </div>

      <h3 class="font-bold text-lg mb-3">Meus Produtos Cadastrados</h3>
      <div id="listaMeusProdutos" class="space-y-3">
        <p class="text-gray-500 text-center py-4">Carregando seus produtos...</p>
      </div>
    </div>
  </div>

  <!-- MODAL FORMULÁRIO DE CRIAR PRODUTO -->
  <div id="modalCriarProduto" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-md w-full relative max-h-[90vh] overflow-y-auto">
      <button onclick="fecharModal('modalCriarProduto')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 class="text-xl font-bold mb-4">Novo Produto</h2>
      
      <form onsubmit="salvarProduto(event)">
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Nome do Produto</label>
          <input type="text" id="prodNome" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Descrição</label>
          <textarea id="prodDescricao" required class="w-full border p-2 rounded-lg" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">URL da Imagem</label>
          <input type="url" id="prodImagem" placeholder="https://exemplo.com/imagem.jpg" class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Preço (MT)</label>
          <input type="number" step="0.01" id="prodPreco" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Tipo de Produto</label>
          <select id="prodTipo" onchange="alternarCamposTipo()" class="w-full border p-2 rounded-lg">
            <option value="FISICO">Físico</option>
            <option value="DIGITAL">Digital</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium mb-1">Método de Recebimento</label>
          <select id="prodMetodo" onchange="alternarCamposTipo()" class="w-full border p-2 rounded-lg">
            <option value="NETSHOP">Netshop (M-Pesa / e-Mola)</option>
            <option value="WHATSAPP">WhatsApp Direto</option>
          </select>
        </div>
        <div class="mb-3" id="campoWhatsapp">
          <label class="block text-sm font-medium mb-1">WhatsApp para Contato</label>
          <input type="tel" id="prodWhatsapp" placeholder="258841234567" class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-4 hidden" id="campoDownload">
          <label class="block text-sm font-medium mb-1">Link de Download (Para Produtos Digitais)</label>
          <input type="url" id="prodDownload" placeholder="https://drive.google.com/..." class="w-full border p-2 rounded-lg">
        </div>
        <button type="submit" id="btnSalvarProd" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Publicar Produto</button>
      </form>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT / COMPRA -->
  <div id="modalCompra" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-md w-full relative">
      <button onclick="fecharModal('modalCompra')" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
      <h2 id="modalTitulo" class="text-xl font-bold mb-2">Comprar Produto</h2>
      <p id="modalPreco" class="text-lg text-blue-600 font-bold mb-4"></p>
      
      <form id="formCheckout" onsubmit="processarCompra(event)">
        <input type="hidden" id="compraProdutoId">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Telefone M-Pesa / e-Mola</label>
          <input type="tel" id="clienteTelefone" placeholder="841234567" required class="w-full border p-2 rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Método de Pagamento</label>
          <select id="metodoPagamento" class="w-full border p-2 rounded-lg">
            <option value="mpesa">M-Pesa</option>
            <option value="emola">e-Mola</option>
          </select>
        </div>
        <button type="submit" id="btnPagar" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Pagar com Netshop</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT INTEGRADO COM O GAS -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz62rB-RTzLg-h6fXMogftj01-z-sCOtTz0PFo7BoTdalzoVQvnIoOfi5a7vcBhOGMh/exec";

    function formatarUrlDownload(url) {
      if (!url) return '';
      
      // Converte link do Google Drive para Download Direto
      if (url.includes('drive.google.com') && url.includes('/file/d/')) {
        const fileId = url.split('/file/d/')[1].split('/')[0];
        return `https://drive.google.com/uc?export=download&id=${fileId}`;
      }
      
      // Garante o download direto no Dropbox
      if (url.includes('dropbox.com') && url.endsWith('dl=0')) {
        return url.replace('dl=0', 'dl=1');
      }
      
      return url;
    }
    document.addEventListener("DOMContentLoaded", () => {
      carregarProdutos();
      verificarSessao();
    });

    function abrirModalAuth() {
      document.getElementById("modalAuth").classList.remove("hidden");
    }

    function trocarModalAuth(fecharId, abrirId) {
      fecharModal(fecharId);
      document.getElementById(abrirId).classList.remove("hidden");
    }

    function fecharModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // --- AUTENTICAÇÃO ---
    async function fazerLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.innerText = "Entrando...";

      const payload = {
        action: "loginVendedor",
        identificador: document.getElementById("loginIdentificador").value,
        pin: document.getElementById("loginPin").value
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const json = await res.json();

        if (json.ok && json.token) {
          localStorage.setItem("moz1_token", json.token);
          fecharModal("modalLogin");
          verificarSessao();
          abrirPainelVendedor();
        } else {
          alert("Erro: " + (json.erro || "PIN ou utilizador incorreto"));
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Entrar";
      }
    }

    async function fazerRegisto(e) {
      e.preventDefault();
      const btn = document.getElementById("btnRegisto");
      btn.disabled = true;
      btn.innerText = "Registando...";

      const payload = {
        action: "registarVendedor",
        nome: document.getElementById("regNome").value,
        telefone: document.getElementById("regTelefone").value,
        bi: document.getElementById("regBi").value,
        empresa: document.getElementById("regEmpresa").value,
        pin: document.getElementById("regPin").value,
        plano: document.getElementById("regPlano").value
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const json = await res.json();

        if (json.ok) {
          alert(json.msg || "Conta criada com sucesso! Faça login.");
          fecharModal("modalRegisto");
          trocarModalAuth('modalRegisto', 'modalLogin');
        } else {
          alert("Erro: " + (json.erro || "Falha ao criar conta"));
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Registar Conta";
      }
    }

    // --- GESTÃO DE PRODUTOS DO VENDEDOR ---
    function abrirPainelVendedor() {
      document.getElementById("modalPainelVendedor").classList.remove("hidden");
      carregarMeusProdutos();
    }

    async function carregarMeusProdutos() {
      const container = document.getElementById("listaMeusProdutos");
      const token = localStorage.getItem("moz1_token");
      if (!token) return;

      container.innerHTML = `<p class="text-gray-500 text-center py-4">Carregando seus produtos...</p>`;

      try {
        const res = await fetch(`${GAS_URL}?action=meusProdutos&token=${encodeURIComponent(token)}`);
        const produtos = await res.json();

        if (Array.isArray(produtos) && produtos.length > 0) {
          container.innerHTML = produtos.map(p => `
            <div class="border p-3 rounded-lg flex justify-between items-center bg-gray-50">
              <div>
                <p class="font-bold">${p.nome}</p>
                <p class="text-sm text-gray-600">${p.preco} MT | Status: <span class="font-bold text-${p.status === 'ATIVO' ? 'green' : 'red'}-600">${p.status}</span></p>
              </div>
              <span class="text-xs bg-gray-200 px-2 py-1 rounded">${p.tipo}</span>
            </div>
          `).join('');
        } else {
          container.innerHTML = `<p class="text-gray-500 text-center py-4">Você ainda não tem produtos cadastrados.</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-red-500 text-center py-4">Erro ao carregar produtos.</p>`;
      }
    }

    function abrirModalCriarProduto() {
      document.getElementById("modalCriarProduto").classList.remove("hidden");
      alternarCamposTipo();
    }

    function alternarCamposTipo() {
      const tipo = document.getElementById("prodTipo").value;
      const metodo = document.getElementById("prodMetodo");
      const campoDownload = document.getElementById("campoDownload");
      const campoWhatsapp = document.getElementById("campoWhatsapp");

      if (tipo === "DIGITAL") {
        metodo.value = "NETSHOP";
        metodo.disabled = true;
        campoDownload.classList.remove("hidden");
        campoWhatsapp.classList.add("hidden");
      } else {
        metodo.disabled = false;
        campoDownload.classList.add("hidden");
        if (metodo.value === "WHATSAPP") {
          campoWhatsapp.classList.remove("hidden");
        } else {
          campoWhatsapp.classList.add("hidden");
        }
      }
    }

    async function salvarProduto(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSalvarProd");
      const token = localStorage.getItem("moz1_token");
      btn.disabled = true;
      btn.innerText = "Salvando...";

      const payload = {
        action: "criarProduto",
        token: token,
        nome: document.getElementById("prodNome").value,
        descricao: document.getElementById("prodDescricao").value,
        imagemUrl: document.getElementById("prodImagem").value,
        preco: parseFloat(document.getElementById("prodPreco").value),
        tipo: document.getElementById("prodTipo").value,
        metodoPagamento: document.getElementById("prodMetodo").value,
        whatsapp: document.getElementById("prodWhatsapp").value,
        downloadUrl: document.getElementById("prodDownload").value
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const json = await res.json();

        if (json.ok) {
          alert(json.msg || "Produto cadastrado com sucesso!");
          fecharModal("modalCriarProduto");
          carregarMeusProdutos();
          carregarProdutos();
        } else {
          alert("Erro: " + (json.erro || "Falha ao criar produto"));
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publicar Produto";
      }
    }

    // --- CARREGAR PRODUTOS PÚBLICOS NA VITRINE ---
    async function carregarProdutos() {
      const grid = document.getElementById("gridProdutos");
      grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Carregando produtos...</p>`;

      const busca = document.getElementById("inputBusca").value;
      const cat = document.getElementById("selectCategoria").value;

      try {
        const res = await fetch(`${GAS_URL}?action=produtos&search=${encodeURIComponent(busca)}&categoria=${encodeURIComponent(cat)}`);
        const json = await res.json();

        if (json.ok && json.produtos.length > 0) {
          grid.innerHTML = json.produtos.map(p => `
            <div class="bg-white rounded-xl shadow overflow-hidden flex flex-col justify-between">
              <img 
                src="${p.imagemUrl || 'https://via.placeholder.com/300x200?text=Sem+Imagem'}" 
                onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200?text=Sem+Imagem';" 
                alt="${p.nome}" 
                class="w-full h-48 object-cover"
              >
              <div class="p-4 flex-grow">
                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">${p.tipo}</span>
                <h3 class="font-bold text-lg mt-2">${p.nome}</h3>
                <p class="text-gray-600 text-sm mt-1 line-clamp-2">${p.descricao}</p>
                <p class="text-blue-600 font-bold text-xl mt-3">${p.preco} MT</p>
                <p class="text-xs text-gray-400 mt-1">Vendedor: ${p.marca}</p>
              </div>
              <div class="p-4 border-t">
                ${p.metodoPagamento === 'NETSHOP' 
                  ? `<button onclick="abrirCompra('${p.produtoId}', '${p.nome}', ${p.preco})" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">Comprar Agora</button>`
                  : `<a href="https://wa.me/${p.whatsapp}?text=Olá! Tenho interesse no produto: ${encodeURIComponent(p.nome)}" target="_blank" class="w-full block text-center bg-green-500 text-white py-2 rounded-lg font-bold hover:bg-green-600 transition">Contactar WhatsApp</a>`
                }
              </div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Nenhum produto encontrado.</p>`;
        }
      } catch (e) {
        grid.innerHTML = `<p class="text-red-500 col-span-full text-center py-8">Erro ao carregar produtos.</p>`;
      }
    }
  </script>
</body>
</html>
